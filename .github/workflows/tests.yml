name: FirstPay checks
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax
        run: |
          node --check finance.mjs
          node --check app.js
      - name: Run finance unit tests
        run: node --test tests/*.test.mjs
